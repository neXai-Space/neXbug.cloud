<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>neXbug.cloud - Bug Report Center</title>
<script>
// Membajak fungsi fetch bawaan browser
const originalFetch = window.fetch;
window.fetch = async function(...args) {
    const url = args[0];
    
    // Jika ada request dari tool inspector yang mencoba mengambil source code
    if (typeof url === 'string' && (url.includes('.html') || url.includes('.js') || url.includes('.css'))) {
        // Balikkan respon palsu!
        return new Response("Sorry, unable to fetch source code :(", {
            status: 200,
            headers: { 'Content-Type': 'text/plain' }
        });
    }
    
    return originalFetch.apply(this, args);
};
</script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Form Section */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .form-group label i {
      margin-right: 6px;
      color: var(--accent-blue);
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .textarea-field {
      resize: vertical;
      min-height: 110px;
    }

    .select-field option {
      background: #0f172a;
      color: #fff;
    }

    /* Radio Impact Options */
    .impact-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .impact-option {
      position: relative;
    }

    .impact-option input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .impact-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .impact-option input:checked + .impact-label {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-blue);
      color: #fff;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 28px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 18px;
      }
      .impact-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand-badge">
        <i class="fa-solid fa-bug"></i> neXbug.cloud System
      </div>
      <h1>Lapor Bug & Issue</h1>
      <p>Temukan sistem yang error atau kendala teknis? Kirimkan detail bug langsung ke Owner via WhatsApp untuk segera ditangani.</p>
    </div>

    <!-- Form -->
    <form id="bugForm">
      <div class="form-group">
        <label for="reporterName"><i class="fa-solid fa-user"></i> Nama Pelapor</label>
        <input type="text" id="reporterName" class="input-field" placeholder="Masukkan nama Anda..." required />
      </div>

      <div class="form-group">
        <label for="bugCategory"><i class="fa-solid fa-list-check"></i> Kategori Bug</label>
        <select id="bugCategory" class="select-field" required>
          <option value="" disabled selected>Pilih kategori kendala...</option>
          <option value="UI/Tampilan Error">UI / Tampilan Rusak</option>
          <option value="Fitur Tidak Berfungsi">Fitur Tidak Berfungsi</option>
          <option value="Sistem Crash/Blank">Sistem Crash / Blank</option>
          <option value="Celah Keamanan">Celah Keamanan (Security)</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-triangle-exclamation"></i> Tingkat Dampak (Severity)</label>
        <div class="impact-options">
          <label class="impact-option">
            <input type="radio" name="impact" value="Rendah (Low)" checked />
            <span class="impact-label"><i class="fa-solid fa-circle-info" style="color:#60a5fa; margin-bottom:4px;"></i> Low</span>
          </label>
          <label class="impact-option">
            <input type="radio" name="impact" value="Sedang (Medium)" />
            <span class="impact-label"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b; margin-bottom:4px;"></i> Medium</span>
          </label>
          <label class="impact-option">
            <input type="radio" name="impact" value="Kritis (Critical)" />
            <span class="impact-label"><i class="fa-solid fa-skull" style="color:#ef4444; margin-bottom:4px;"></i> Critical</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="bugDetail"><i class="fa-solid fa-align-left"></i> Detail & Langkah Replikasi Bug</label>
        <textarea id="bugDetail" class="textarea-field" placeholder="Jelaskan kronologi munculnya bug, lokasi halaman, atau pesan error yang muncul..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-brands fa-whatsapp"></i> Kirim Laporan ke WhatsApp
      </button>
    </form>

    <div class="footer">
      &copy; 2026 neXbug.cloud • All Rights Reserved
    </div>
  </div>

  <script>

     // Block klik kanan
document.addEventListener('contextmenu', e => e.preventDefault());

// Block F12, Ctrl+U, Ctrl+Shift+I
document.onkeydown = function(e) {
  if(e.key == 'F12' || (e.ctrlKey && e.key == 'u') ) {
    return false;
  }
}
    // Ganti nomor WhatsApp tujuan di bawah ini (gunakan format internasional tanpa + atau 0 di depan, misal: 628xxxxxxxxxx)
    const OWNER_WA_NUMBER = "6285727658632";

    document.getElementById("bugForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("reporterName").value.trim();
      const category = document.getElementById("bugCategory").value;
      const impact = document.querySelector('input[name="impact"]:checked').value;
      const detail = document.getElementById("bugDetail").value.trim();

      // Format teks untuk pesan WhatsApp
      const message = `*🚨 LAPORAN BUG - neXbug.my.id*%0A%0A` +
                      `👤 *Pelapor:* ${encodeURIComponent(name)}%0A` +
                      `📂 *Kategori:* ${encodeURIComponent(category)}%0A` +
                      `⚡ *Dampak:* ${encodeURIComponent(impact)}%0A%0A` +
                      `📝 *Detail Bug:*%0A${encodeURIComponent(detail)}%0A%0A` +
                      `---%0A_Dikirim melalui portal neXbug.my.id_`;

      // Buat URL WA dan buka di tab baru
      const waUrl = `https://wa.me/${OWNER_WA_NUMBER}?text=${message}`;
      window.open(waUrl, "_blank");
    });
  </script>
</body>
</html>
